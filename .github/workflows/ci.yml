name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - run: npm ci
      - run: cp app/src/config.template.js app/src/config.js
      - run: npm test

  docker:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing images is a release step that needs registry credentials.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: sepehr/meeting:ci
          cache-from: type=gha,scope=sepehrmeet
          cache-to: type=gha,mode=max,scope=sepehrmeet
