<!doctype html>
<html lang="fa" dir="rtl">
    <head>

        <meta charset="utf-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="stylesheet" href="../vendor/fonts/vazirmatn/vazirmatn.css" />
        <link rel="stylesheet" href="../vendor/fontawesome/6.1.1/css/all.min.css" />
        <link rel="stylesheet" href="../css/SepehrLight.css" />
        <style>
            .mnt {
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 2rem 1rem;
                text-align: center;
            }
            .mnt__icon {
                width: 84px;
                height: 84px;
                margin: 0 auto 1.4rem;
                border-radius: 26px;
                display: grid;
                place-items: center;
                background: var(--sp-grad);
                color: #fff;
                font-size: 1.8rem;
                box-shadow: 0 22px 48px -20px rgba(99, 102, 241, 0.8);
            }
            .mnt h1 {
                font-size: clamp(1.7rem, 4vw, 2.6rem);
                font-weight: 800;
                letter-spacing: -0.02em;
            }
            .mnt p {
                max-width: 34em;
                margin: 0.9rem auto 0;
                color: var(--sp-muted);
                line-height: 2;
            }
            .mnt a {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                margin-top: 1.6rem;
                padding: 0.75rem 1.4rem;
                border-radius: 14px;
                background: var(--sp-grad);
                color: #fff;
                font-weight: 700;
                box-shadow: 0 14px 32px -14px rgba(99, 102, 241, 0.85);
            }

    <body class="sp-page">
        <div class="sp-bg" aria-hidden="true">
            <span class="sp-orb sp-orb--1"></span>
            <span class="sp-orb sp-orb--2"></span>
            <span class="sp-orb sp-orb--3"></span>
        </div>
        <main class="mnt">
            <div>

                <h1>به‌زودی برمی‌گردیم</h1>
                <p>
                    در حال انجام به‌روزرسانی‌های لازم هستیم. بابت این وقفه کوتاه پوزش می‌خواهیم؛ لطفاً کمی
                    بعد دوباره سر بزنید.
                </p>
                <a href="/"><i class="fas fa-rotate-right" aria-hidden="true"></i> تلاش دوباره</a>
