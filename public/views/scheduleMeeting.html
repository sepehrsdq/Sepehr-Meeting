<div class="sch-form">
    <div class="sch-field">
        <label class="sch-label" for="schTitle">
            <i class="fas fa-heading sch-icon"></i> عنوان جلسه
            <span class="sch-required">*</span>
        </label>
        <input type="text" id="schTitle" class="sch-input" placeholder="مثلاً جلسه هفتگی تیم" maxlength="100" />
    </div>
    <div class="sch-field">
        <label class="sch-label" for="schDescription"> <i class="fas fa-align-left sch-icon"></i> توضیح </label>
        <input type="text" id="schDescription" class="sch-input" placeholder="توضیح اختیاری" maxlength="255" />
    </div>
    <div class="sch-field">
        <label class="sch-label" for="schRoomName">
            <i class="fas fa-door-open sch-icon"></i> نام اتاق
            <span class="sch-required">*</span>
        </label>
        <input type="text" id="schRoomName" class="sch-input" placeholder="مثلاً: jalse-team" maxlength="64" />
    </div>
    <div class="sch-row">
        <div class="sch-field">
            <label class="sch-label" for="schDateTime">
                <i class="fas fa-calendar-alt sch-icon"></i> تاریخ و ساعت
                <span class="sch-required">*</span>
            </label>
            <input type="text" id="schDateTime" class="sch-input" placeholder="تاریخ و ساعت را انتخاب کنید" />
        </div>
        <div class="sch-field">
            <label class="sch-label" for="schDuration">
                <i class="fas fa-clock sch-icon"></i> مدت (دقیقه)
                <span class="sch-required">*</span>
            </label>
            <input type="number" id="schDuration" class="sch-input" value="60" min="5" max="480" />
        </div>
    </div>
    <div class="sch-field">
        <label class="sch-label" for="schRecipients">
            <i class="fas fa-envelope sch-icon"></i> گیرندگان
            <span class="sch-required">*</span>
        </label>
        <input type="text" id="schRecipients" class="sch-input" placeholder="نشانی ایمیل همکاران" />
        <p class="sch-hint">چند ایمیل را با ویرگول جدا کنید.</p>
    </div>
</div>
